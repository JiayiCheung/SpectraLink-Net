# SpectraLink-Net 配置文件 (v4.2)
# 支持深度监督

data:
  data_dir: '/home/bingxing2/home/scx7776/run/CSUqx/SLinkNet/data/preprocess/processed/data'
  props_dir: '/home/bingxing2/home/scx7776/run/CSUqx/SLinkNet/data/preprocess/processed/properties'
  split_file: '/home/bingxing2/home/scx7776/run/CSUqx/SLinkNet/data/preprocess/5fold_splits.json'
  patch_size: [64, 128, 128]
  samples_per_volume: 4
  oversample_foreground: 0.7
  batch_size: 2
  num_workers: 8

model:
  in_channels: 1
  out_channels: 1
  num_levels: 3
  
  # ===== 容量参数 =====
  base_channels: 64
  freq_token_base: 8
  expansion_ratio: 4
  num_heads: 8
  
  # ===== 频域空间token参数 =====
  pool_sizes: [[6,6,6], [6,6,6], [6,6,6]]
  
  # ===== 正则化 =====
  dropout: 0.1
  
  # ===== 显存优化 =====
  use_checkpoint: true
  
  # ===== 深度监督 (v4.2新增) =====
  deep_supervision: true

training:
  # 与所有 baseline 对齐
  num_epochs: 250
  warmup_epochs: 10
  learning_rate: 0.001
  min_lr: 0.000001
  weight_decay: 0.00001
  gradient_clip: 1.0
  early_stop_patience: 100
  validate_every: 1
  save_every: 10

  # ===== 显存优化 =====
  use_amp: true
  accumulation_steps: 1

loss:
  # 与所有 baseline 对齐
  w_dice: 0.7
  w_bce: 0.3
  pos_weight: 6.0
  
  # ===== 深度监督 (v4.2新增) =====
  deep_supervision: true
  ds_weights: [1.0, 0.5, 0.25]  # nnU-Net风格指数递减

augmentation:
  enable: true

output:
  base_dir: 'outputs'
